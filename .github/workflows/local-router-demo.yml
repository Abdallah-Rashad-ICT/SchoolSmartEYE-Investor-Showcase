name: Local router demo tests

on:
  pull_request:
    paths:
      - "local-router-demo/**"
      - ".github/workflows/local-router-demo.yml"
  push:
    branches: [main]
    paths:
      - "local-router-demo/**"
      - ".github/workflows/local-router-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run local router end-to-end tests
        working-directory: local-router-demo
        run: python -m unittest -v
